name: Build & Publish Feature App Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "New release tag (e.g. v0.1.1; existing tags cannot be overwritten)"
        required: true

concurrency:
  group: feature-app-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event.inputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate new release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]]; then
            echo "::error::Use a new version tag such as v0.1.1 or v0.1.1-rc.1."
            exit 1
          fi
          git check-ref-format "refs/tags/${TAG_NAME}"
          EXISTING_TAG="$(git ls-remote --tags origin "refs/tags/${TAG_NAME}")"
          EXISTING_RELEASES="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name')"
          if [[ -n "$EXISTING_TAG" ]] || printf '%s\n' "$EXISTING_RELEASES" | grep -Fxq -- "$TAG_NAME"; then
            echo "::error::This tag already exists. Choose a new tag to preserve pinned notebook downloads."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build deterministic feature tarballs, manifest & notebooks
        run: |
          python3 tools/build_release.py --tag "${TAG_NAME}"
          python3 tools/build_notebooks.py

      - name: Sync updated manifest & notebooks to main
        run: |
          if [[ -n "$(git status --porcelain tools/release_manifest.json notebooks/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/release_manifest.json notebooks/
            git commit -m "chore(release): sync manifest and notebooks for ${TAG_NAME}"
            git push origin HEAD:main
          fi

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${TAG_NAME}" release_artifacts/*.tar.gz release_artifacts/SHA256SUMS \
            --target "$(git rev-parse HEAD)" \
            --title "${TAG_NAME}" \
            --generate-notes
