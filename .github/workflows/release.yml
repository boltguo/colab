name: Build & Publish Feature App Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build deterministic feature tarballs & SHA256SUMS
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          python3 tools/build_release.py --tag "${TAG_NAME}"

      - name: Upload artifacts to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release_artifacts/*.tar.gz release_artifacts/SHA256SUMS --clobber
          else
            gh release create "${TAG_NAME}" release_artifacts/*.tar.gz release_artifacts/SHA256SUMS \
              --title "Feature Apps ${TAG_NAME}" \
              --generate-notes
          fi
