name: Build & Publish Feature App Releases

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build deterministic feature tarballs, manifest & notebooks
        run: |
          TAG_NAME="${{ github.event.inputs.tag }}"
          python3 tools/build_release.py --tag "${TAG_NAME}"
          python3 tools/build_notebooks.py

      - name: Sync updated manifest & notebooks to main
        run: |
          if [[ -n "$(git status --porcelain tools/release_manifest.json notebooks/)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tools/release_manifest.json notebooks/
            git commit -m "chore(release): sync manifest and notebooks for ${{ github.event.inputs.tag }}"
            git push origin HEAD:main
          fi

      - name: Upload artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.event.inputs.tag }}"
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release_artifacts/*.tar.gz release_artifacts/SHA256SUMS --clobber
          else
            gh release create "${TAG_NAME}" release_artifacts/*.tar.gz release_artifacts/SHA256SUMS \
              --target main \
              --title "${TAG_NAME}" \
              --generate-notes
          fi
